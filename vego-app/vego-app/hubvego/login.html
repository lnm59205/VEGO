<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeGo Hub - Đăng nhập Đối tác</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.4) 0%, rgba(5, 150, 105, 0.45) 100%);
            z-index: 1;
        }

        /* Ambient floating circles */
        .ambient-circle {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            pointer-events: none;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            margin: 0 auto 16px;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
        }

        .input-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px 12px 46px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            outline: none;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        /* Demo Helper widget */
        .demo-accounts {
            margin-top: 24px;
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #e2e8f0;
        }

        .demo-accounts h4 {
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .account-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .account-tag {
            background: #e2e8f0;
            color: #475569;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .account-tag:hover {
            background: #10b981;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Ambient elements -->
    <div class="ambient-circle" style="width: 300px; height: 300px; top: -100px; left: -100px;"></div>
    <div class="ambient-circle" style="width: 400px; height: 400px; bottom: -150px; right: -150px;"></div>

    <div class="login-box">
        <div class="header">
            <div class="logo"><i class="fas fa-recycle"></i></div>
            <h2 class="title">VeGo Hub</h2>
            <p class="subtitle">Đăng nhập cổng thông tin đối tác thu gom</p>
        </div>

        <div class="error-message" id="errorDiv">Tài khoản hoặc mật khẩu không chính xác!</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <div class="input-wrapper">
                    <i class="fas fa-user-circle input-icon"></i>
                    <input type="text" class="form-control" id="username" placeholder="Ví dụ: hadong" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <i class="fas fa-key input-icon"></i>
                    <input type="password" class="form-control" id="password" placeholder="Mật khẩu của trạm (123)" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-submit">Đăng nhập</button>
        </form>

        <div class="demo-accounts">
            <h4>💡 Tài khoản Trạm dùng thử (Pass: 123):</h4>
            <div class="account-tags">
                <span class="account-tag" onclick="quickFill('hadong')">hadong (Hà Đông)</span>
                <span class="account-tag" onclick="quickFill('molao')">molao (Mỗ Lao)</span>
                <span class="account-tag" onclick="quickFill('vanquan')">vanquan (Văn Quán)</span>
                <span class="account-tag" onclick="quickFill('tohieu')">tohieu (Tô Hiệu)</span>
                <span class="account-tag" onclick="quickFill('phucla')">phucla (Phúc La)</span>
            </div>
        </div>
    </div>

    <script>
        // Database of 10 stations matching home-map markers
        const STATIONS_DB = [
            { username: 'hadong', password: '123', name: 'Vựa ve chai Hà Đông', wallet: 2500000 },
            { username: 'quangtrung', password: '123', name: 'Thu mua phế liệu Quang Trung', wallet: 1800000 },
            { username: 'eco', password: '123', name: 'Điểm thu gom Eco Hà Nội', wallet: 3000000 },
            { username: 'molao', password: '123', name: 'VeGo Station Mỗ Lao', wallet: 1500000 },
            { username: 'vanquan', password: '123', name: 'Thu gom xanh Văn Quán', wallet: 2200000 },
            { username: 'duongnoi', password: '123', name: 'Eco Point Dương Nội', wallet: 1200000 },
            { username: 'tohieu', password: '123', name: 'VeGo Hub Tô Hiệu', wallet: 2000000 },
            { username: 'kienhung', password: '123', name: 'Thu mua Kiến Hưng', wallet: 1600000 },
            { username: 'yennghia', password: '123', name: 'Green Recycle Yên Nghĩa', wallet: 1400000 },
            { username: 'phucla', password: '123', name: 'VeGo Center Phúc La', wallet: 2100000 }
        ];

        // Seed data in localStorage
        if (!localStorage.getItem('vego_stations')) {
            localStorage.setItem('vego_stations', JSON.stringify(STATIONS_DB));
        }

        function quickFill(user) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = '123';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorDiv');

            const stations = JSON.parse(localStorage.getItem('vego_stations') || JSON.stringify(STATIONS_DB));
            const station = stations.find(s => s.username === user && s.password === pass);

            if (station) {
                // Initialize specific station wallet in localStorage if not set
                const walletKey = 'vego_wallet_' + station.username;
                if (!localStorage.getItem(walletKey)) {
                    localStorage.setItem(walletKey, station.wallet.toString());
                }

                // Save session details
                sessionStorage.setItem('currentHubUsername', station.username);
                sessionStorage.setItem('currentHubName', station.name);
                sessionStorage.setItem('currentHubWalletKey', walletKey);

                // Redirect
                window.location.href = 'dashboard.html';
            } else {
                errorDiv.style.display = 'block';
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
